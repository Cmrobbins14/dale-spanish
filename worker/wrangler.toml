# Cloudflare Worker for ¡Dale! — see README "Optional: Cloud listening + AI tutor".
name = "dale-helper"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The system prompt is a plain file you can read and edit.
rules = [{ type = "Text", globs = ["**/*.md"], fallthrough = true }]

# Workers AI (Whisper) for Cloud listening. Free daily allowance.
[ai]
binding = "AI"

# Daily request caps per account. Create with:
#   npx wrangler kv namespace create USAGE
# then paste the id below.
[[kv_namespaces]]
binding = "USAGE"
id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
FIREBASE_PROJECT_ID = "your-firebase-project-id"
# Comma-separated Firebase UIDs allowed to use the worker (learner + grown-up).
FAMILY_UIDS = ""
# Your GitHub Pages origin, e.g. https://yourname.github.io
ALLOWED_ORIGIN = "*"
MODEL = "claude-opus-5-5"
EFFORT = "low"
DAILY_CHAT_LIMIT = "120"
DAILY_TRANSCRIBE_LIMIT = "600"
# Secret (never in this file):  npx wrangler secret put ANTHROPIC_API_KEY
